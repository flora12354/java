<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一瓯春 · 登录</title>
<style>
  :root {
    --tea-green: #4a6b4f;
    --tea-green-deep: #2f4a36;
    --tea-gold: #c8a35b;
    --cream: #f4efe4;
    --ink: #2b2b25;
    --mist: rgba(255, 255, 255, 0.72);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(200,163,91,0.18), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(74,107,79,0.20), transparent 55%),
      linear-gradient(135deg, #eef3ea 0%, #f6f1e6 50%, #ece7d8 100%);
    overflow: hidden;
  }

  /* 飘落的花瓣装饰 */
  .petal {
    position: fixed;
    top: -40px;
    width: 14px; height: 14px;
    background: radial-gradient(circle at 30% 30%, #f7d6df, #e7a9bb);
    border-radius: 0 100% 0 100%;
    opacity: 0.7;
    animation: fall linear infinite;
    pointer-events: none;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }

  .card {
    position: relative;
    width: 380px;
    max-width: 90vw;
    padding: 44px 40px 36px;
    background: var(--mist);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(47,74,54,0.18);
    animation: rise 0.7s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .brand {
    text-align: center;
    margin-bottom: 30px;
  }
  .brand .seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px; height: 64px;
    margin-bottom: 14px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--tea-green), var(--tea-green-deep));
    color: var(--cream);
    font-size: 30px;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(47,74,54,0.35);
  }
  .brand h1 {
    font-size: 30px;
    letter-spacing: 6px;
    color: var(--tea-green-deep);
    font-weight: 700;
  }
  .brand p {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #8a8475;
  }

  .field {
    position: relative;
    margin-bottom: 18px;
  }
  .field input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    border: 1.5px solid #ddd6c6;
    border-radius: 12px;
    background: rgba(255,255,255,0.85);
    font-size: 15px;
    color: var(--ink);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus {
    outline: none;
    border-color: var(--tea-green);
    box-shadow: 0 0 0 3px rgba(74,107,79,0.15);
  }
  .field .icon {
    position: absolute;
    left: 15px; top: 50%;
    transform: translateY(-50%);
    font-size: 17px;
    opacity: 0.6;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 2px 22px;
    font-size: 13px;
  }
  .row label { display: flex; align-items: center; gap: 6px; color: #6b6657; cursor: pointer; }
  .row a { color: var(--tea-green); text-decoration: none; }
  .row a:hover { text-decoration: underline; }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(145deg, var(--tea-green), var(--tea-green-deep));
    color: #fff;
    font-size: 16px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 10px 24px rgba(47,74,54,0.32);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(47,74,54,0.4); }
  .btn:active { transform: translateY(0); }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 18px;
    color: #a9a290;
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #ddd6c6;
  }

  .oauth { display: flex; gap: 12px; justify-content: center; }
  .oauth button {
    flex: 1;
    padding: 11px;
    border: 1.5px solid #ddd6c6;
    border-radius: 12px;
    background: rgba(255,255,255,0.8);
    font-size: 13px;
    color: #5b564a;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .oauth button:hover { border-color: var(--tea-gold); background: #fff; }

  .foot {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: #9a9484;
  }
  .foot a { color: var(--tea-green); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }

  .toast {
    position: fixed;
    left: 50%; bottom: 40px;
    transform: translateX(-50%) translateY(20px);
    padding: 12px 22px;
    background: var(--tea-green-deep);
    color: #fff;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 10px 24px rgba(0,0,0,0.25);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="card">
    <div class="brand">
      <div class="seal">春</div>
      <h1>一瓯春</h1>
      <p>一盏清欢 · 共赴春约</p>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <span class="icon">👤</span>
        <input type="text" id="account" placeholder="手机号 / 用户名" required>
      </div>
      <div class="field">
        <span class="icon">🔒</span>
        <input type="password" id="password" placeholder="密码" required>
      </div>

      <div class="row">
        <label><input type="checkbox" id="remember"> 记住我</label>
        <a href="#" onclick="return false;">忘记密码？</a>
      </div>

      <button class="btn" type="submit">登 录</button>
    </form>

    <div class="divider">其他登录方式</div>
    <div class="oauth">
      <button onclick="oauth('微信')">微信登录</button>
      <button onclick="oauth('QQ')">QQ登录</button>
    </div>

    <div class="foot">
      还没有账号？<a href="#" onclick="return false;">立即注册</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // 飘落花瓣
  const colors = ['#f7d6df', '#f3c6d4', '#ead7b0'];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (6 + Math.random() * 6) + 's';
    p.style.animationDelay = (Math.random() * 6) + 's';
    p.style.opacity = 0.4 + Math.random() * 0.4;
    p.style.background = 'radial-gradient(circle at 30% 30%, ' + colors[i % colors.length] + ', #e7a9bb)';
    document.body.appendChild(p);
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const acc = document.getElementById('account').value.trim();
    const pwd = document.getElementById('password').value;
    if (!acc || !pwd) { toast('请填写账号和密码'); return; }
    toast('欢迎回来，「' + acc + '」— 正在进入一瓯春…');
  });

  function oauth(name) {
    toast('已唤起「' + name + '」登录（示例）');
  }
</script>
</body>
</html>
